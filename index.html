<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Downland</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #07060d;
    --pad: #17142a;
    --pad-edge: #3a3263;
    --pad-down: #2c2552;
    --ink: #cfc6ff;
    --ink-dim: #8a82b8;
    --jump: #add300;
    --jump-ink: #10140a;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding-inline: 16px; box-sizing: border-box;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #stage {
    max-width: 1100px; margin-inline: auto;
    display: grid; gap: 14px; padding-block: 12px;
    grid-template-columns: 1fr; grid-template-areas: "screen" "controls" "system" "help";
  }
  canvas {
    grid-area: screen; justify-self: center;
    width: 100%; max-width: 960px; aspect-ratio: 320 / 200; image-rendering: pixelated;
    background: #000;
  }
  .touch { display: none; }
  .controls { grid-area: controls; justify-content: space-between; align-items: center; gap: 16px; }
  .dpad { display: grid; gap: 8px; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 52px); }
  button {
    font: inherit; color: var(--ink); background: var(--pad);
    border: 1px solid var(--pad-edge); border-radius: 10px;
    touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.down { background: var(--pad-down); }
  button:focus-visible { outline: 2px solid var(--jump); outline-offset: 2px; }
  .dpad button { font-size: 20px; }
  .dpad [data-hold="up"] { grid-column: 2; grid-row: 1; }
  .dpad [data-hold="left"] { grid-column: 1; grid-row: 2; }
  .dpad [data-hold="right"] { grid-column: 3; grid-row: 2; }
  .dpad [data-hold="down"] { grid-column: 2; grid-row: 3; }
  .jump {
    width: 104px; height: 104px; border-radius: 50%;
    background: var(--jump); color: var(--jump-ink); border-color: var(--jump);
    font-weight: 700; letter-spacing: .08em;
  }
  .jump.down { background: var(--jump); filter: brightness(.75); }
  .system { grid-area: system; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .system button { padding: 8px 12px; font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; }
  #help { grid-area: help; color: var(--ink-dim); max-width: 960px; justify-self: center; text-align: center; }
  kbd { background: var(--pad); border: 1px solid var(--pad-edge); border-radius: 3px; padding: 0 4px; }

  /* Phones and tablets: on-screen controls instead of keyboard help. */
  @media (pointer: coarse) {
    .touch { display: flex; }
    #help { display: none; }
  }
  /* Landscape phone: d-pad and jump either side of the screen. */
  @media (pointer: coarse) and (orientation: landscape) {
    #stage {
      grid-template-columns: auto 1fr auto; grid-template-areas: "dpad screen jump" "system system system";
      align-items: center; padding-block: 6px; gap: 10px;
    }
    /* Fit the height, or the width left after the d-pad (196px), jump (104px), gaps and gutters. */
    canvas { width: auto; height: min(100vh - 70px, (100vw - 352px) * 0.625); }
    .controls { display: contents; }
    .dpad { grid-area: dpad; }
    .jump { grid-area: jump; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="320" height="200" aria-label="Downland"></canvas>
  <div class="controls touch">
    <div class="dpad" aria-label="Direction pad">
      <button id="pad-up" data-hold="up" aria-label="Climb up">▲</button>
      <button id="pad-left" data-hold="left" aria-label="Walk left">◀</button>
      <button id="pad-right" data-hold="right" aria-label="Walk right">▶</button>
      <button id="pad-down" data-hold="down" aria-label="Climb down">▼</button>
    </div>
    <button id="pad-jump" class="jump" data-hold="jump">JUMP</button>
  </div>
  <div class="system touch">
    <button id="sys-prev" data-press="[">◀ CHAMBER</button>
    <button id="sys-next" data-press="]">CHAMBER ▶</button>
    <button id="sys-diff" data-press="d">DIFFICULTY</button>
    <button id="sys-restart" data-press="r">RESTART</button>
  </div>
  <div id="help">
    <kbd>←</kbd><kbd>→</kbd> walk · <kbd>↑</kbd><kbd>↓</kbd> climb rope · <kbd>Space</kbd> jump ·
    <kbd>[</kbd><kbd>]</kbd> or <kbd>0</kbd>–<kbd>9</kbd>, <kbd>X</kbd> pick chamber ·
    walk into an open door to change chamber (keys open doors) · <kbd>D</kbd> difficulty ·
    <kbd>R</kbd> restart
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
